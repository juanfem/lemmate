name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Read-only by default; the one job that publishes (the draft release) asks for more itself.
# Third-party actions are pinned by commit, with the tag they were resolved from alongside, so a
# moved tag cannot change what runs here.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # lemmate-core / lemmate-server / lemmate-cli. The Tauri desktop shell is excluded: it pulls in
  # Tauri, which needs webkit2gtk and friends — see the `desktop` job below.
  rust:
    name: Rust (fmt, clippy, test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - name: cargo fmt
        run: cargo fmt --all --check

      - name: cargo clippy
        run: cargo clippy --locked --workspace --exclude lemmate-desktop --all-targets -- -D warnings

      - name: cargo test
        run: cargo test --locked --workspace --exclude lemmate-desktop

  # The declared rust-version (workspace Cargo.toml) has to keep building: it is what distro
  # packagers and the Gentoo toolchain on the dev machine actually have.
  msrv:
    name: Rust (MSRV 1.95, check)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          toolchain: "1.95"

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: msrv

      - name: cargo check
        run: cargo check --locked --workspace --exclude lemmate-desktop --all-targets

  # RustSec advisories against Cargo.lock. Informational for now — continue-on-error — because an
  # advisory in a transitive dependency of Tauri or the like is often not ours to fix the same
  # day; the job still shows up yellow in the run summary when there is one.
  audit:
    name: cargo audit
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      - name: cargo audit
        run: cargo audit

  # The live end-to-end suites in ui/test (sync, relay) skip themselves unless they are given
  # built binaries, so the `node` job runs them inert. This job builds the binaries and runs
  # them for real, plus the pandoc export tests, which skip unless LEMMATE_TEST_PANDOC is set.
  e2e:
    name: End-to-end (live server, pandoc)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # Upstream's build, not Ubuntu's: Debian builds pandoc without embedded data files, and
      # under `--sandbox` (which every export runs with) that pandoc cannot find its own
      # docx/pptx templates — "Could not find data file data/data/docx/[Content_Types].xml",
      # jgm/pandoc#8128. Same version as the dev machine.
      - name: Install pandoc
        env:
          PANDOC_VERSION: 3.10.1
          PANDOC_SHA256: b419369915e0f3181be0afdb040ec8ecc6b70e72e5992652a0d83aed9e6bc109
        run: |
          deb="pandoc-${PANDOC_VERSION}-1-amd64.deb"
          curl -fsSLO "https://github.com/jgm/pandoc/releases/download/${PANDOC_VERSION}/${deb}"
          echo "${PANDOC_SHA256}  ${deb}" | sha256sum -c -
          sudo dpkg -i "${deb}"
          pandoc --version | head -n1

      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: e2e

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Build the server and the CLI
        run: cargo build --locked -p lemmate-server -p lemmate-cli

      - name: pandoc tests
        env:
          LEMMATE_TEST_PANDOC: /usr/bin/pandoc
        run: "cargo test --locked -p lemmate-core pandoc::"

      - name: npm ci
        working-directory: ui
        run: npm ci

      - name: node --test (live)
        working-directory: ui
        env:
          LEMMATE_SERVER_BIN: ${{ github.workspace }}/target/debug/lemmate-server
          LEMMATE_CLI_BIN: ${{ github.workspace }}/target/debug/lemmate
        run: npm test

  # Type-check the Tauri desktop shell: building it would also need a bundler toolchain, and
  # nothing here produces an artifact. The system packages are Tauri 2's Linux prerequisites.
  desktop:
    name: Rust (desktop, check only)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libsoup-3.0-dev \
            librsvg2-dev

      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: desktop

      # tauri-build resolves bundle.resources ("../../ui/dist/") and fails the build script if the
      # path is missing. ui/dist is gitignored and nothing here produces a bundle, so an empty
      # directory is all the type-check needs; the real assets only matter to `cargo tauri build`.
      - name: Placeholder for the bundled web assets
        shell: bash
        run: mkdir -p ui/dist

      - name: cargo check
        run: cargo check --locked -p lemmate-desktop

  # macOS and Windows never run the full suite here — no runner has a vault, a server or a
  # webview to drive — but they do have to compile, including the Tauri shell (WKWebView and
  # WebView2 need no extra system packages). The credentials tests come along because they are
  # what pins the per-user config directory and the OS keychain down on each platform.
  cross:
    name: Rust (${{ matrix.os }}, check only)
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: cross-${{ matrix.os }}

      # tauri-build resolves bundle.resources ("../../ui/dist/") and fails the build script if the
      # path is missing. ui/dist is gitignored and nothing here produces a bundle, so an empty
      # directory is all the type-check needs; the real assets only matter to `cargo tauri build`.
      - name: Placeholder for the bundled web assets
        shell: bash
        run: mkdir -p ui/dist

      - name: cargo check
        run: cargo check --locked --workspace --all-targets

      # The ignored test writes a throwaway entry to the runner's real keychain (Keychain on
      # macOS, Credential Manager on Windows) and removes it: the one place the keychain
      # backend is exercised for real, since no Linux runner has an unlocked Secret Service.
      - name: cargo test (paths, keychain)
        run: "cargo test --locked -p lemmate-core --features keychain credentials:: -- --include-ignored"

  # Svelte type-check plus the markdown corpus tests. ui/test also holds live end-to-end tests
  # that skip themselves unless LEMMATE_SERVER_BIN / LEMMATE_CLI_BIN point at built binaries, so
  # they are inert here; the `e2e` job runs them against real ones.
  node:
    name: Web client (check, test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - run: npm ci

      - name: svelte-check
        run: npm run check

      - name: node --test
        run: npm test

  # Proves the deployment image still builds from a clean context. Not pushed anywhere.
  docker:
    name: Docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: lemmate:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Installable artifacts: the server and CLI binaries, the web assets they serve, and the
  # desktop bundles Tauri produces on each platform. Nothing here is signed or notarised, so
  # these are a convenience for people who would otherwise build the tree themselves — see
  # docs/install.md, which says the same about the bundles it tells you to build by hand.
  #
  # Only on main, on a v* tag, and on demand: three desktop bundles per pull-request push is a
  # lot of runner minutes for something nobody downloads.
  artifacts:
    name: Artifacts (${{ matrix.slug }})
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    needs: [rust, node]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            slug: linux-x86_64
          - os: macos-latest
            slug: macos-aarch64
          - os: windows-latest
            slug: windows-x86_64
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # Same packages as the `desktop` job, plus what the bundlers themselves need: libxdo for
      # the desktop crate's link step, patchelf and file for the AppImage.
      - name: Install Tauri system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libsoup-3.0-dev \
            librsvg2-dev \
            libxdo-dev \
            patchelf \
            file

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: artifacts-${{ matrix.slug }}

      # Real assets this time, not the empty placeholder the check jobs make: the server serves
      # this directory with --web-dir, and tauri-build copies it into the desktop bundle.
      - name: Build the web client
        working-directory: ui
        run: |
          npm ci
          npm run build

      - name: Build the server and the CLI
        run: cargo build --locked --release -p lemmate-server -p lemmate-cli

      # The npm package ships a prebuilt binary for each platform, so this costs seconds where
      # `cargo install tauri-cli` costs minutes. WiX and NSIS are downloaded by the CLI itself.
      - name: Build the desktop bundles
        working-directory: crates/desktop
        shell: bash
        env:
          # Linux only, and both were needed to get an AppImage out of this tree at all.
          # linuxdeploy and appimagetool are themselves AppImages and want FUSE 2, which an
          # Ubuntu 24.04 runner does not have; extracting them instead is the documented way
          # round it. NO_STRIP because linuxdeploy's strip pass then fails on a binary the
          # release profile has already stripped. Ignored on macOS and Windows.
          APPIMAGE_EXTRACT_AND_RUN: 1
          NO_STRIP: 1
        run: |
          npm install -g @tauri-apps/cli@^2
          tauri build -- --locked

      # Cheap proof that what is about to be uploaded actually starts on this platform: a
      # bundle that cannot run is worse than no bundle, and nothing else here executes them.
      - name: Smoke-check the binaries
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ runner.os }}" = "Windows" ]; then ext=".exe"; else ext=""; fi
          "target/release/lemmate$ext" --version
          "target/release/lemmate-server$ext" --version
          "target/release/lemmate$ext" doctor

      - name: Collect
        shell: bash
        run: |
          set -euo pipefail
          stage="dist/lemmate-${{ matrix.slug }}"
          mkdir -p "$stage/web"
          cp -r ui/dist/. "$stage/web/"
          cp LICENSE README.md docs/install.md docs/guide.md docs/deploy.md "$stage/"
          for bin in lemmate lemmate-server; do
            if [ -f "target/release/$bin.exe" ]; then
              cp "target/release/$bin.exe" "$stage/"
            else
              cp "target/release/$bin" "$stage/"
            fi
          done
          # `lemmate-server --web-dir web` from inside the unpacked folder, so say so there.
          cat > "$stage/ARTIFACT.md" <<'EOF'
          Unsigned build of Lemmate, straight from CI. `lemmate` is the CLI, `lemmate-server`
          the server, and `web/` the client it serves:

              ./lemmate-server --data-dir ./data --web-dir ./web
              ./lemmate doctor

          The desktop installers are published beside this archive, not inside it. See
          install.md for prerequisites, and for why an unsigned bundle needs a hand past
          Gatekeeper on macOS and SmartScreen on Windows.
          EOF
          cd dist
          if [ "${{ runner.os }}" = "Windows" ]; then
            7z a "lemmate-${{ matrix.slug }}.zip" "lemmate-${{ matrix.slug }}" > /dev/null
          else
            tar czf "lemmate-${{ matrix.slug }}.tar.gz" "lemmate-${{ matrix.slug }}"
          fi
          rm -rf "lemmate-${{ matrix.slug }}"

      # deb/rpm/AppImage on Linux, dmg on macOS, msi and the NSIS setup.exe on Windows. The
      # macOS .app is a directory and is left behind: the dmg carries it.
      - name: Collect the desktop bundles
        shell: bash
        run: |
          set -euo pipefail
          find target/release/bundle -maxdepth 2 -type f \
            \( -name '*.deb' -o -name '*.rpm' -o -name '*.AppImage' \
               -o -name '*.dmg' -o -name '*.msi' -o -name '*-setup.exe' \) \
            -exec cp {} dist/ \;
          ls -l dist

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: lemmate-${{ matrix.slug }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14

  # A v* tag turns the three artifact sets into a *draft* release: unsigned binaries should not
  # appear under a published tag without someone looking at them first.
  release:
    name: Draft release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: artifacts
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: dist
          merge-multiple: true

      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: dist/*
          fail_on_unmatched_files: true
          draft: true
          generate_release_notes: true
