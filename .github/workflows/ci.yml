name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # lemmate-core / lemmate-server / lemmate-cli. The two Tauri shells are excluded: they pull in
  # Tauri, which needs webkit2gtk and friends — see the `shells` job below.
  rust:
    name: Rust (fmt, clippy, test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: cargo fmt
        run: cargo fmt --all --check

      - name: cargo clippy
        run: cargo clippy --workspace --exclude lemmate-desktop --exclude lemmate-mobile --all-targets -- -D warnings

      - name: cargo test
        run: cargo test --workspace --exclude lemmate-desktop --exclude lemmate-mobile

  # Type-check the two Tauri shells: building either would also need a bundler toolchain (and,
  # for Android, an NDK and an SDK), and nothing here produces an artifact. The system packages
  # are Tauri 2's Linux prerequisites. lemmate-mobile's own tests run here rather than in the
  # `rust` job because this is where those packages are.
  shells:
    name: Rust (desktop + mobile, check only)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libsoup-3.0-dev \
            librsvg2-dev

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: desktop

      # tauri-build resolves bundle.resources ("../../ui/dist/") and fails the build script if the
      # path is missing, and lemmate-mobile compiles the same directory in with `include_dir!`.
      # ui/dist is gitignored and nothing here produces a bundle, so an empty directory is all
      # the type-check needs; the real assets only matter to `cargo tauri build`.
      - name: Placeholder for the bundled web assets
        shell: bash
        run: mkdir -p ui/dist

      - name: cargo check
        run: cargo check -p lemmate-desktop -p lemmate-mobile

      - name: cargo test (mobile)
        run: cargo test -p lemmate-mobile

  # macOS and Windows never run the full suite here — no runner has a vault, a server or a
  # webview to drive — but they do have to compile, including the Tauri shell (WKWebView and
  # WebView2 need no extra system packages). The credentials tests come along because they are
  # what pins the per-user config directory down on each platform.
  cross:
    name: Rust (${{ matrix.os }}, check only)
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: cross-${{ matrix.os }}

      # tauri-build resolves bundle.resources ("../../ui/dist/") and fails the build script if the
      # path is missing. ui/dist is gitignored and nothing here produces a bundle, so an empty
      # directory is all the type-check needs; the real assets only matter to `cargo tauri build`.
      - name: Placeholder for the bundled web assets
        shell: bash
        run: mkdir -p ui/dist

      - name: cargo check
        run: cargo check --workspace --all-targets

      - name: cargo test (paths)
        run: "cargo test -p lemmate-core credentials::"

  # Svelte type-check plus the markdown corpus tests. ui/test also holds live end-to-end tests
  # that skip themselves unless LEMMATE_SERVER_BIN / LEMMATE_CLI_BIN point at built binaries, so
  # they are inert here and the Rust job stays the one that compiles them.
  node:
    name: Web client (check, test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - run: npm ci

      - name: svelte-check
        run: npm run check

      - name: node --test
        run: npm test

  # Proves the deployment image still builds from a clean context. Not pushed anywhere.
  docker:
    name: Docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: lemmate:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
