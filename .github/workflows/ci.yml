name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # notes-core / notes-server / notes-cli. notes-desktop is excluded: it pulls in Tauri, which
  # needs webkit2gtk and friends — see the `desktop` job below.
  rust:
    name: Rust (fmt, clippy, test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: cargo fmt
        run: cargo fmt --all --check

      - name: cargo clippy
        run: cargo clippy --workspace --exclude notes-desktop --all-targets -- -D warnings

      - name: cargo test
        run: cargo test --workspace --exclude notes-desktop

  # Type-check only: building the Tauri shell would also need a bundler toolchain, and nothing
  # here produces a desktop artifact. The system packages are Tauri 2's Linux prerequisites.
  desktop:
    name: Rust (desktop, check only)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libsoup-3.0-dev \
            librsvg2-dev

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: desktop

      - name: cargo check
        run: cargo check -p notes-desktop

  # Svelte type-check plus the markdown corpus tests. ui/test also holds live end-to-end tests
  # that skip themselves unless NOTES_SERVER_BIN / NOTES_CLI_BIN point at built binaries, so
  # they are inert here and the Rust job stays the one that compiles them.
  node:
    name: Web client (check, test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - run: npm ci

      - name: svelte-check
        run: npm run check

      - name: node --test
        run: npm test

  # Proves the deployment image still builds from a clean context. Not pushed anywhere.
  docker:
    name: Docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: notes:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
