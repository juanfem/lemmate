<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Speaker view — Lemmate</title>
<!--
  A deck's speaker view (SPEC §5.6), opened by `S` in a deck Lemmate rendered.

  reveal.js's own speaker view cannot work there: a rendered deck runs sandboxed, with an origin
  of its own, and reveal.js builds its speaker view by writing into a window it opens. This page
  does the same job by messages only. The deck (this window's opener) tells it where it is and
  what the slide's notes are; the previews are two more sandboxed copies of the render the deck
  came from, set to that slide with reveal.js's postMessage commands; and the buttons and arrow
  keys turn the deck the same way. The notes are the note author's HTML, so they are drawn in a
  frame with scripts off — nothing from the deck ever lands in this page's own document.
-->
<style>
  :root { color-scheme: dark; }
  html, body { margin: 0; height: 100%; background: #1b1b1f; color: #e8e6e3; font: 15px/1.45 system-ui, -apple-system, 'Segoe UI', sans-serif; }
  .grid { display: grid; grid-template-columns: minmax(0, 3fr) minmax(0, 2fr); grid-template-rows: minmax(0, 3fr) minmax(0, 2fr) auto; gap: 10px; height: 100%; box-sizing: border-box; padding: 10px; }
  .box { position: relative; min-height: 0; border-radius: 8px; overflow: hidden; background: #26262b; }
  .box > .label { position: absolute; top: 6px; left: 10px; z-index: 1; font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: #a8a5a0; pointer-events: none; }
  .current { grid-row: 1 / 3; }
  iframe { width: 100%; height: 100%; border: 0; display: block; background: white; }
  .preview iframe { pointer-events: none; }
  .notes iframe { background: #26262b; }
  .bar { grid-column: 1 / 3; display: flex; align-items: center; gap: 14px; padding: 4px 6px; }
  .bar button { font: inherit; color: inherit; background: #34343a; border: 1px solid #45454c; border-radius: 6px; padding: 6px 14px; cursor: pointer; }
  .bar button:hover { background: #3d3d44; }
  .time { font-variant-numeric: tabular-nums; font-size: 22px; }
  .muted { color: #a8a5a0; }
  .spacer { flex: 1; }
  .gone { padding: 24px; color: #a8a5a0; }
</style>
</head>
<body>
<div class="grid" id="grid" hidden>
  <div class="box current preview"><span class="label">Current slide</span><iframe id="now" title="Current slide" sandbox="allow-scripts"></iframe></div>
  <div class="box preview"><span class="label">Up next</span><iframe id="next" title="Next slide" sandbox="allow-scripts"></iframe></div>
  <div class="box notes"><span class="label">Notes</span><iframe id="notes" title="Speaker notes" sandbox=""></iframe></div>
  <div class="bar">
    <button id="prev" title="Previous slide (←)">‹ Previous</button>
    <button id="fwd" title="Next slide (→, space)">Next ›</button>
    <span class="muted">Slide <span id="count">–</span></span>
    <span class="spacer"></span>
    <span class="muted">Elapsed</span> <span class="time" id="elapsed">0:00:00</span>
    <button id="reset" title="Start the timer again">Reset</button>
    <span class="muted">Clock</span> <span class="time" id="clock"></span>
  </div>
</div>
<p class="gone" id="gone" hidden></p>
<script>
(function () {
  var q = new URLSearchParams(location.search)
  var id = /^[0-9A-Za-z]+$/
  var vault = q.get('vault'), note = q.get('note'), render = q.get('render')
  var deck = window.opener
  var gone = document.getElementById('gone')
  function fail(msg) { gone.textContent = msg; gone.hidden = false; document.getElementById('grid').hidden = true }
  if (!deck || ![vault, note, render].every(function (v) { return v && id.test(v) })) {
    return fail('Open the speaker view from a deck: press S in a deck Lemmate rendered.')
  }

  var now = document.getElementById('now'), next = document.getElementById('next'), notes = document.getElementById('notes')
  var last = null
  var NOTES_STYLE = '<style>body{margin:28px 14px 14px;font:20px/1.5 system-ui,sans-serif;color:#e8e6e3;background:#26262b}a{color:#9ab4ff}</style>'
  function say(frame, method, args) { try { frame.contentWindow.postMessage(JSON.stringify({ method: method, args: args || [] }), '*') } catch (e) {} }
  // The previews show a slide and nothing else: no controls, no animation, no keyboard of their own.
  function quiet(frame) { say(frame, 'configure', [{ controls: false, progress: false, slideNumber: false, transition: 'none', backgroundTransition: 'none', keyboard: false, overview: false, autoSlide: 0, hash: false, history: false }]) }
  function show(frame, state, ahead) {
    quiet(frame)
    say(frame, 'setState', [state])
    if (ahead) say(frame, 'next')
  }
  function update() {
    if (!last) return
    show(now, last.state, false)
    show(next, last.state, true)
    document.getElementById('count').textContent = last.index + ' of ' + last.total
    notes.srcdoc = NOTES_STYLE + (last.notes || '<p style="color:#8a8780">No notes for this slide.</p>')
  }
  window.addEventListener('message', function (e) {
    if (e.source !== deck) return
    var d; try { d = JSON.parse(e.data) } catch (x) { return }
    if (!d || d.lemmateDeck !== 1 || !d.state) return
    last = { state: d.state, notes: String(d.notes || ''), index: Number(d.index) || 0, total: Number(d.total) || 0 }
    update()
  })
  // The previews are the render the deck came from, which the server keeps a while.
  fetch('/api/v1/vaults/' + vault + '/notes/' + note + '/render/' + render + '?format=revealjs', { credentials: 'same-origin' })
    .then(function (r) { if (!r.ok) throw new Error(r.status); return r.text() })
    .then(function (page) {
      document.getElementById('grid').hidden = false
      var loaded = 0
      function ready() { if (++loaded === 2) { setTimeout(function () { update(); hello() }, 400) } }
      now.addEventListener('load', ready, { once: true })
      next.addEventListener('load', ready, { once: true })
      // A preview is a slide, not a deck to drive: no menu button, no arrows.
      var still = '<style>.slide-menu-button,.reveal .controls,.reveal .progress{display:none!important}</style>'
      // Just inside the opening <head>: the first one is the document's own, while a closing tag
      // can turn up earlier inside the notes plugin's script, which writes a page of its own.
      var head = page.search(/<head[\s>]/i), at = head < 0 ? 0 : page.indexOf('>', head) + 1
      page = page.slice(0, at) + still + page.slice(at)
      now.srcdoc = page
      next.srcdoc = page
    })
    .catch(function () { fail('The deck could not be loaded here. Close this window and press S in the deck again.') })
  // Ask the deck where it is; again for a while, since it may still be starting.
  function hello() { try { deck.postMessage(JSON.stringify({ lemmateSpeaker: 'hello' }), '*') } catch (e) {} }
  hello()
  var tries = 0, ask = setInterval(function () { if (last || ++tries > 20) clearInterval(ask); else hello() }, 500)

  function turn(method) { try { deck.postMessage(JSON.stringify({ method: method, args: [] }), '*') } catch (e) {} }
  document.getElementById('prev').onclick = function () { turn('prev') }
  document.getElementById('fwd').onclick = function () { turn('next') }
  document.addEventListener('keydown', function (e) {
    if (e.key === 'ArrowRight' || e.key === 'ArrowDown' || e.key === ' ' || e.key === 'PageDown') { e.preventDefault(); turn('next') }
    else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp' || e.key === 'PageUp') { e.preventDefault(); turn('prev') }
  })

  var start = Date.now()
  document.getElementById('reset').onclick = function () { start = Date.now() }
  function pad(n) { return (n < 10 ? '0' : '') + n }
  function tick() {
    var s = Math.floor((Date.now() - start) / 1000)
    document.getElementById('elapsed').textContent = Math.floor(s / 3600) + ':' + pad(Math.floor(s / 60) % 60) + ':' + pad(s % 60)
    document.getElementById('clock').textContent = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
    if (deck.closed) fail('The deck was closed.')
  }
  tick(); setInterval(tick, 1000)
})()
</script>
</body>
</html>
