<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- `resizes-content`: the on-screen keyboard shrinks the layout, so the tab strip and
         note header stay put instead of being pushed off the top of the editor. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, interactive-widget=resizes-content" />
    <meta name="color-scheme" content="light dark" />
    <!-- Served from ui/public, so these are copied to the root of ui/dist verbatim. -->
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <!-- The browser paints its own chrome with this before the app's CSS has loaded, so the two
         values track --bg in app.css rather than the icon's cream. iOS below 17 reads the
         apple- meta rather than the manifest's display mode; newer ones ignore it. -->
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#fdfcfb" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#1a1816" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Lemmate" />
    <title>Lemmate</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
