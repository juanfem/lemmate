[package]
name = "notes-core"
description = "Shared core: CRDT docs, persistence, sync protocol, file projection, markdown indexing"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
blake3 = "1"
markdown = "1"
notify = "8"
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml_ng = "0.10"
similar = "3"
thiserror = "2"
tracing = "0.1"
ulid = "3"
yrs = { version = "0.27", features = ["sync"] }

[dev-dependencies]
tempfile = "3"
