[package]
name = "notes-core"
description = "Shared core: CRDT docs, persistence, sync protocol, file projection, markdown indexing"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
axum = { version = "0.8", features = ["ws"] }
blake3 = "1"
futures-util = "0.3"
markdown = "1"
mime_guess = "2"
notify = "8"
rusqlite = { version = "0.40", features = ["bundled"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
rustls-pki-types = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml_ng = "0.10"
similar = "3"
thiserror = "2"
tokio = { version = "1", features = ["rt", "sync", "time", "macros", "net"] }
tokio-tungstenite = { version = "0.29", features = ["rustls-tls-webpki-roots"] }
tower-http = { version = "0.7", features = ["fs"] }
tracing = "0.1"
ulid = "3"
ureq = "3"
webpki-roots = "1"
yrs = { version = "0.27", features = ["sync"] }

[dev-dependencies]
tempfile = "3"
