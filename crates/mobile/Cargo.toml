[package]
name = "lemmate-mobile"
description = "Tauri 2 mobile shell: runs the local sync relay in-process and opens the app on it"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
name = "lemmate_mobile"
# `staticlib` and `cdylib` are what the generated Android and iOS projects link against;
# `rlib` is what keeps `cargo check` and `cargo test` working on the host.
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "lemmate-mobile"
path = "src/main.rs"

[build-dependencies]
tauri-build = "2"

[dependencies]
anyhow = "1"
include_dir = "0.7"
lemmate-core.workspace = true
serde = { version = "1", features = ["derive"] }
tauri = "2"
toml = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
