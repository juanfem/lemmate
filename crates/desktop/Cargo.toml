[package]
name = "lemmate-desktop"
description = "Tauri 2 desktop shell: runs the local sync relay and opens one window on it"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[[bin]]
name = "lemmate-desktop"
path = "src/main.rs"

[build-dependencies]
tauri-build = "2"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
lemmate-core.workspace = true
serde = { version = "1", features = ["derive"] }
tauri = "2"
toml = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
