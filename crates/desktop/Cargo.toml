[package]
name = "lemmate-desktop"
description = "Tauri 2 desktop shell: runs the local sync relay and opens one window on it"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[[bin]]
name = "lemmate-desktop"
path = "src/main.rs"

[build-dependencies]
tauri-build = "2"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
lemmate-core = { workspace = true, features = ["keychain"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = "2"
toml = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# The webview Tauri runs on Linux, for its spell checker (`spelling.rs`). Same version as wry's.
[target.'cfg(target_os = "linux")'.dependencies]
webkit2gtk = "2.0"

# Printing a render natively on macOS (`print.rs`), where the webview prints nothing for a page.
# The versions Tauri's wry already uses.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSGeometry", "NSObject"] }
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "objc2-core-foundation", "NSPrintInfo", "NSPrintOperation", "NSResponder", "NSView", "NSWindow"] }
objc2-web-kit = { version = "0.3", default-features = false, features = ["std", "objc2-app-kit", "objc2-core-foundation", "WKWebView"] }

[dev-dependencies]
tempfile = "3"
