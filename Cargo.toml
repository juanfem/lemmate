[workspace]
resolver = "3"
members = ["crates/core", "crates/server", "crates/cli", "crates/desktop"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-or-later"
repository = ""
rust-version = "1.95"

[workspace.dependencies]
lemmate-core = { path = "crates/core" }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
